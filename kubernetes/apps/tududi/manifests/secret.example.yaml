# TEMPLATE / EXEMPLO - NÃO contém valores reais e PODE ser versionado.
#
# O Secret REAL (tududi-secrets) NÃO deve ser commitado no Git.
# Ele é aplicado fora do GitOps, de uma das duas formas:
#
#   1) kubectl (simples):
#      kubectl create secret generic tududi-secrets -n tududi \
#        --from-literal=TUDUDI_USER_EMAIL='voce@exemplo.com' \
#        --from-literal=TUDUDI_USER_PASSWORD='<senha-forte>' \
#        --from-literal=TUDUDI_SESSION_SECRET='<openssl rand -hex 64>' \
#        --from-literal=ENCRYPTION_KEY='<openssl rand -hex 32>'
#
#   2) Sealed Secrets (se instalado): selar este arquivo com kubeseal e
#      versionar apenas o SealedSecret resultante.
#
# Como o ArgoCD roda com prune+selfHeal, este Secret é criado fora do
# Kustomization (não está listado em kustomization.yaml), então o ArgoCD
# não vai tentar removê-lo.
apiVersion: v1
kind: Secret
metadata:
  name: tududi-secrets
  namespace: tududi
type: Opaque
stringData:
  TUDUDI_USER_EMAIL: "voce@exemplo.com"
  TUDUDI_USER_PASSWORD: "troque-por-uma-senha-forte"
  TUDUDI_SESSION_SECRET: "gere-com-openssl-rand-hex-64"
  ENCRYPTION_KEY: "gere-com-openssl-rand-hex-32"
