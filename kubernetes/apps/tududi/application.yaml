apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tududi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # O ArgoCD puxa manifests deste repositório (público) na branch master.
    repoURL: https://github.com/juanozorio/oke-cluster.git
    targetRevision: master
    # Caminho da pasta dos manifests dentro do repo acima.
    path: kubernetes/apps/tududi/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tududi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Respeita o Secret aplicado fora do Git (não será removido pelo prune,
      # pois não faz parte do kustomization.yaml).
      - ApplyOutOfSyncOnly=true
