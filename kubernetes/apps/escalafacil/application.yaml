# escalafacil (https://escalafacil.ozorio.dev.br) gerenciado pelo ArgoCD.
#
# Fluxo de deploy: edite kubernetes/apps/escalafacil/chart/values-prod.yaml (image.tag),
# abra PR / dê push na master e o ArgoCD faz o rollout. Não use `kubectl set image`
# nem `helm upgrade`: com selfHeal ligado o ArgoCD reverte qualquer mudança manual.
#
# O chart mora AQUI (repo público) e não no repo do app (escala-aguias, privado),
# porque o ArgoCD só lê repositórios públicos sem credencial extra.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: escalafacil
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/juanozorio/oke-cluster.git
    targetRevision: master
    path: kubernetes/apps/escalafacil/chart
    helm:
      # Mantém o prefixo dos recursos (escalafacil-escala-servir) idêntico ao da
      # instalação original feita com `helm install escalafacil`.
      releaseName: escalafacil
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: escala
  syncPolicy:
    # Sync automático: o repo é a fonte da verdade. selfHeal desfaz qualquer
    # mudança manual (kubectl set image, edição na UI); prune remove o que
    # sair do chart.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
