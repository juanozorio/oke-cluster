# Valores de PRODUÇÃO do escalafacil (https://escalafacil.ozorio.dev.br).
# É o único arquivo que você edita no dia a dia: para publicar uma versão nova,
# troque image.tag e dê push -- o ArgoCD faz o rollout.

image:
  # Imagem permanente no Docker Hub (público), publicada pelo CI do repo
  # escala-aguias a cada merge na master. Tag = commit curto (12 chars).
  # Para publicar uma versão nova: troque a tag abaixo, abra PR e faça merge;
  # o ArgoCD faz o rollout. Nome totalmente qualificado: o CRI-O do OKE recusa
  # "short names".
  repository: docker.io/juanozorio/escala-servir
  tag: "c5029de079c7"
  pullPolicy: IfNotPresent

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: escalafacil.ozorio.dev.br
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - escalafacil.ozorio.dev.br
      secretName: escalafacil-tls
