# App-of-Apps RAIZ: bootstrap do cluster com UM comando.
#
#   kubectl apply -f kubernetes/bootstrap/root-app.yaml
#
# O ArgoCD passa a varrer kubernetes/ e criar/sincronizar todo
# kubernetes/addons/<nome>/application.yaml e kubernetes/apps/<nome>/application.yaml.
# Adicionar um app = criar uma pasta nova com um application.yaml + PR.
#
# prune: FALSE (de propósito). Os Applications filhos têm o finalizer
# resources-finalizer, então APAGAR uma pasta de app e deixar o root podar
# o Application apagaria também TODOS os recursos do app (inclusive o PVC do
# tududi). Com prune desligado, remover um arquivo só deixa o Application
# "órfão" no cluster; para desinstalar um app de verdade, apague-o de forma
# consciente (kubectl delete application <nome> -n argocd).
#
# O baofeng-airsoft não tem sync automático (igual ao original criado pela UI):
# o root cria/atualiza o objeto Application, mas não força o sync dos recursos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/juanozorio/oke-cluster.git
    targetRevision: master
    path: kubernetes
    directory:
      recurse: true
      # SÓ os application.yaml de addons/ e apps/. Isto deixa de fora este
      # bootstrap/ (o root não gerencia a si mesmo), os values.yaml, os manifestos
      # e os charts, que são lidos pelos Applications filhos, não pelo root.
      include: "{addons,apps}/*/application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
