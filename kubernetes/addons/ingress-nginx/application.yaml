# ingress-nginx gerenciado pelo ArgoCD (GitOps).
# Versão PINADA na que já roda (chart 4.14.3 / app 1.14.3). Os values abaixo são
# EXATAMENTE os usados na instalação original (`helm get values`), e o
# `kubectl diff` do chart renderizado contra o cluster dá vazio.
#
# NodePort 30080/30443: é o que o Network Load Balancer da OCI aponta como backend
# (ver loadbalancer/ no Terraform). NÃO mude sem atualizar o Terraform.
#
# sync-wave "0": sobe depois do cert-manager (wave -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.14.3
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/kubernetes/addons/ingress-nginx/values.yaml
    - repoURL: https://github.com/juanozorio/oke-cluster.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
