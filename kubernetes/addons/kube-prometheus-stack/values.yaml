# Configuração do kube-prometheus-stack. Quem lê isto é o ./application.yaml (ao lado).
# Para mudar algo: edite aqui, abra PR e faça merge; o ArgoCD aplica.
# A versão do chart fica no application.yaml (targetRevision).

# ---- Desligados (sem sentido no OKE / sem uso) ----
alertmanager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    alertmanager: false

# ---- Prometheus (emptyDir, retention curta) ----
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 2GB
    # Sem storageSpec => emptyDir (sem persistência).
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 900Mi
    # Descobre ServiceMonitors/PodMonitors/regras de qualquer release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# ---- Operator ----
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# ---- Grafana (dashboards provisionados por ConfigMap; sem persistência) ----
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # Exposto em https://grafana.ozorio.dev.br (TLS Let's Encrypt via cert-manager).
  # PRÉ-REQUISITO: registro DNS A grafana.ozorio.dev.br -> 129.213.129.75 no
  # registro.br (não há wildcard). Sem ele o certificado não é emitido.
  # O Grafana bloqueia o login por 5 min após 5 tentativas erradas (padrão);
  # o rate limit do nginx abaixo é uma segunda camada.
  grafana.ini:
    server:
      domain: grafana.ozorio.dev.br
      root_url: https://grafana.ozorio.dev.br
    users:
      allow_sign_up: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/limit-rps: "10"
      nginx.ingress.kubernetes.io/limit-connections: "20"
    hosts:
      - grafana.ozorio.dev.br
    path: /
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.ozorio.dev.br
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    # 256Mi dava OOMKilled no boot (o Grafana carrega dezenas de APIs).
    limits:
      cpu: 300m
      memory: 512Mi
  sidecar:
    # 64Mi dava OOMKilled: os sidecars carregam todos os ConfigMaps de
    # dashboards/datasources do stack.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 160Mi

# ---- Exporters ----
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
