# cert-manager gerenciado pelo ArgoCD (GitOps).
# Versão PINADA na que já roda (v1.19.2). Antes era instalado por manifesto
# estático (kubectl apply), não por Helm. Os values reproduzem os `resources`
# que o cluster já tinha; o `kubectl diff` do chart renderizado dá vazio, e os
# 6 CRDs só diferem em `conversion` (None implícito do apiserver vs. omitido no
# chart), o que é equivalente.
#
# crds.keep: o ArgoCD NUNCA remove os CRDs num prune (apagar CRD apagaria todos
# os seus Certificate/ClusterIssuer).
#
# sync-wave "-1": sobe ANTES do ingress-nginx e de tudo que usa Certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.19.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/kubernetes/addons/cert-manager/values.yaml
    - repoURL: https://github.com/juanozorio/oke-cluster.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    # Adoção feita com revisão de diff; sync automático ligado depois de Synced.
    # selfHeal desfaz mudança manual; prune NÃO remove CRDs (crds.keep).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
