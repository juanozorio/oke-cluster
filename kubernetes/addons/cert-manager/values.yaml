# Configuração do cert-manager. Quem lê isto é o ./application.yaml (ao lado).
# Para mudar algo: edite aqui, abra PR e faça merge; o ArgoCD aplica.
# A versão do chart fica no application.yaml (targetRevision).

crds:
  enabled: true
  keep: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
