# Configuração do metrics-server. Quem lê isto é o ./application.yaml (ao lado).
# Para mudar algo: edite aqui, abra PR e faça merge; o ArgoCD aplica.
# A versão do chart fica no application.yaml (targetRevision).

replicas: 1
resources:
  requests:
    cpu: 20m
    memory: 40Mi
  limits:
    cpu: 100m
    memory: 100Mi
args:
  # O kubelet do OKE foi aceito SEM --kubelet-insecure-tls (testado), então
  # a flag fica de fora: não desligue a validação de TLS sem necessidade.
  - --kubelet-preferred-address-types=InternalIP
