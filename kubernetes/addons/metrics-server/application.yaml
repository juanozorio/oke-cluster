# metrics-server: habilita `kubectl top` e HPA (Metrics API).
# Guarda só o valor atual de CPU/memória (sem histórico); é leve (~20m CPU).
# Para histórico, alertas e dashboards seria preciso kube-prometheus-stack, que
# NÃO substitui o metrics-server (não expõe a Metrics API por padrão).
#
# sync-wave "1": sobe depois do ingress-nginx e do cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.14.0
      helm:
        releaseName: metrics-server
        valueFiles:
          - $values/kubernetes/addons/metrics-server/values.yaml
    - repoURL: https://github.com/juanozorio/oke-cluster.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
