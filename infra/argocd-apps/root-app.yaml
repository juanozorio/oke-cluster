# App-of-Apps RAIZ: bootstrap do cluster com UM comando.
#
#   kubectl apply -f infra/argocd-apps/root-app.yaml
#
# O ArgoCD passa a observar esta pasta (infra/argocd-apps/) e criar/sincronizar
# todo Application que estiver nela. Adicionar um app = criar um YAML aqui + push.
#
# prune: FALSE (de propósito). Os Applications filhos têm o finalizer
# resources-finalizer, então APAGAR um arquivo desta pasta e deixar o root podar
# o Application apagaria também TODOS os recursos do app (inclusive o PVC do
# tududi). Com prune desligado, remover um arquivo só deixa o Application
# "órfão" no cluster; para desinstalar um app de verdade, apague-o de forma
# consciente (kubectl delete application <nome> -n argocd).
#
# O baofeng-airsoft não tem sync automático (igual ao original criado pela UI):
# o root cria/atualiza o objeto Application, mas não força o sync dos recursos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/juanozorio/oke-cluster.git
    targetRevision: master
    path: infra/argocd-apps
    directory:
      recurse: false
      # Não gerencia a si mesmo (evita laço); só os filhos.
      exclude: "root-app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
