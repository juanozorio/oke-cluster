# ingress-nginx gerenciado pelo ArgoCD (GitOps).
# Versão PINADA na que já roda (chart 4.14.3 / app 1.14.3). Os values abaixo são
# EXATAMENTE os usados na instalação original (`helm get values`), e o
# `kubectl diff` do chart renderizado contra o cluster dá vazio.
#
# NodePort 30080/30443: é o que o Network Load Balancer da OCI aponta como backend
# (ver loadbalancer/ no Terraform). NÃO mude sem atualizar o Terraform.
#
# sync-wave "0": sobe depois do cert-manager (wave -1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.14.3
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          # Os limits abaixo NÃO estavam no `helm install` original: foram aplicados
          # à mão no cluster. Entram aqui para o GitOps não os remover (e não
          # recriar o controller sem necessidade).
          resources:
            requests:
              cpu: 100m
              memory: 90Mi
            limits:
              cpu: 300m
              memory: 256Mi
          service:
            type: NodePort
            nodePorts:
              http: 30080
              https: 30443
            annotations:
              oci-network-load-balancer.oraclecloud.com/security-list-management-mode: All
              oci.oraclecloud.com/load-balancer-type: nlb
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
