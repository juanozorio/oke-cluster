apiVersion: apps/v1
kind: Deployment
metadata:
  name: tududi
  namespace: tududi
  labels:
    app.kubernetes.io/name: tududi
spec:
  replicas: 1
  # SQLite é single-writer: nunca rodar mais de 1 réplica.
  # Recreate garante que o pod antigo solte o PVC (RWO) antes de subir o novo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tududi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tududi
    spec:
      automountServiceAccountToken: false
      # NOTA de design: a imagem do Tududi inicia como root APENAS para ajustar
      # permissões (chown -R /app) e então dropa para o usuário 1001 (app) via
      # su-exec no entrypoint. Ou seja, a APLICAÇÃO roda como não-root.
      # Por isso NÃO forçamos runAsNonRoot/runAsUser no pod (brigaria com o
      # entrypoint). fsGroup garante que os volumes montados sejam graváveis.
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tududi
          image: docker.io/chrisvel/tududi:1.9.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            # --- Configuração atrás do nginx-ingress (TLS terminado no ingress) ---
            - name: TUDUDI_INTERNAL_SSL_ENABLED
              value: "false"
            - name: TUDUDI_TRUST_PROXY
              value: "1"
            - name: BASE_URL
              value: "https://tududi.ozorio.dev.br"
            - name: TUDUDI_ALLOWED_ORIGINS
              value: "https://tududi.ozorio.dev.br"
            - name: NODE_ENV
              value: "production"
          envFrom:
            # Valores sensíveis (email/senha do admin, session secret, encryption key)
            - secretRef:
                name: tududi-secrets
          volumeMounts:
            - name: data
              mountPath: /app/db
              subPath: db
            - name: data
              mountPath: /app/uploads
              subPath: uploads
            - name: data
              mountPath: /app/backups
              subPath: backups
            - name: tmp
              mountPath: /tmp
          securityContext:
            # A imagem precisa de rootfs gravável no boot (chown -R /app) e de
            # algumas capabilities para ajustar dono e trocar de usuário (su-exec).
            # Dropamos TODO o resto e mantemos seccomp RuntimeDefault.
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETUID
                - SETGID
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
        # --- Sidecar de backup contínuo (Litestream) ---
        # Lê o MESMO volume do SQLite e faz streaming do WAL para o Object Storage.
        # Perda máxima em caso de desastre: segundos (não as 24h de um backup diário).
        - name: litestream
          image: litestream/litestream:0.3.13
          args: ["replicate", "-config", "/etc/litestream/litestream.yml"]
          envFrom:
            - secretRef:
                name: tududi-litestream-s3
          volumeMounts:
            - name: data
              mountPath: /app/db
              subPath: db
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tududi-data
        - name: tmp
          emptyDir: {}
        - name: litestream-config
          configMap:
            name: tududi-litestream
