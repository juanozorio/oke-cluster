# TEMPLATE / EXEMPLO - NÃO contém valores reais e PODE ser versionado.
#
# O Secret REAL (tududi-litestream-s3) NÃO deve ser commitado. Ele carrega uma
# "Customer Secret Key" (par Access Key / Secret Key estilo S3) da OCI, que o
# Litestream usa para escrever no bucket tududi-backups via endpoint S3-compat.
#
# COMO GERAR a Customer Secret Key (uma vez):
#   Console OCI -> Profile -> My profile -> Customer Secret Keys -> Generate.
#   Ou via CLI:
#     oci iam customer-secret-key create --user-id <SEU_USER_OCID> \
#       --display-name tududi-litestream --profile DEFAULT
#   O Access Key é o "id" retornado; o Secret Key aparece SÓ UMA VEZ na criação.
#
# COMO CRIAR o Secret real (fora do Git):
#   kubectl create secret generic tududi-litestream-s3 -n tududi \
#     --from-literal=LITESTREAM_ACCESS_KEY_ID='<access-key>' \
#     --from-literal=LITESTREAM_SECRET_ACCESS_KEY='<secret-key>'
apiVersion: v1
kind: Secret
metadata:
  name: tududi-litestream-s3
  namespace: tududi
type: Opaque
stringData:
  LITESTREAM_ACCESS_KEY_ID: "TROCAR-pela-access-key"
  LITESTREAM_SECRET_ACCESS_KEY: "TROCAR-pela-secret-key"
