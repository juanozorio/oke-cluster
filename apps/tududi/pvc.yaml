apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tududi-data
  namespace: tududi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      # TEMPORÁRIO (migração para free tier): o Deployment NÃO usa mais este PVC
      # (agora emptyDir + Litestream). Ele fica só como cópia de segurança dos dados
      # originais até a validação, e será removido na fase 2. 50Gi é o mínimo da
      # OCI e estoura o limite de 200 GB gratuitos (custava ~R$ 0,36/dia).
      storage: 50Gi
