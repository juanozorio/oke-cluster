apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tududi

# Recursos versionados no Git (NÃO inclui o Secret real com valores sensíveis).
# O Secret é aplicado fora do Git (kubectl / Sealed Secrets) - ver secret.example.yaml.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - litestream-config.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: tududi
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
